<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>작은 격투</title>
<style>
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#10081a; color:#fff; touch-action:none;
    font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  #app { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; }
  #stageWrap { position:relative; flex:1; width:100%; min-height:0; display:flex; align-items:flex-start; justify-content:center; }
  canvas { display:block; background:#000; touch-action:none; }
  #pause { position:absolute; right:6px; top:56px; width:32px; height:32px; border-radius:10px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.3); color:#fff; font-size:13px; z-index:3; }
  /* 조작 버튼 */
  #pad { width:100%; max-width:560px; display:flex; justify-content:space-between; align-items:flex-end; padding:6px 10px calc(10px + env(safe-area-inset-bottom)); gap:10px; flex:0 0 auto; }
  .cl { display:grid; grid-template-columns:repeat(2,64px); grid-template-rows:repeat(2,58px); gap:7px; }
  .cl .j { grid-column:1 / span 2; }
  .cr { display:grid; grid-template-columns:repeat(2,66px); grid-template-rows:repeat(2,62px); gap:7px; }
  .pb { position:relative; border:none; border-radius:16px; color:#fff; font-size:20px; font-weight:800; background:linear-gradient(180deg,#3b2a5e,#241638); box-shadow:0 3px 0 #0b0614, inset 0 0 0 1px rgba(255,255,255,.18); touch-action:none; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
  .pb small { font-size:10px; font-weight:700; opacity:.8; margin-top:2px; }
  .pb.on { transform:translateY(2px); box-shadow:0 1px 0 #0b0614, inset 0 0 0 1px rgba(255,255,255,.4); filter:brightness(1.35); }
  .pb.atk { background:linear-gradient(180deg,#e0583a,#8a2a18); }
  .pb.hv { background:linear-gradient(180deg,#ff9a2a,#a85010); }
  .pb.bk { background:linear-gradient(180deg,#3a8ae0,#1a4a8a); }
  .pb.sp { background:linear-gradient(180deg,#b060ff,#5a22a8); }
  .pb.sp.ready { animation:rdy .7s ease-in-out infinite alternate; }
  @keyframes rdy { from { box-shadow:0 3px 0 #0b0614, 0 0 6px #d8a0ff; } to { box-shadow:0 3px 0 #0b0614, 0 0 20px #f0c8ff; } }
  /* 가로 화면: 조작 버튼을 화면 양쪽 아래에 겹쳐 놓는다 */
  @media (orientation:landscape) and (max-height:520px) {
    #pad { position:absolute; left:0; right:0; bottom:0; max-width:none; padding:0 14px calc(8px + env(safe-area-inset-bottom)); pointer-events:none; }
    #pad > * { pointer-events:auto; opacity:.78; }
    .cl { grid-template-columns:repeat(2,56px); grid-template-rows:repeat(2,50px); }
    .cr { grid-template-columns:repeat(2,58px); grid-template-rows:repeat(2,54px); }
    .pb { font-size:17px; }
  }
  /* 안내 창 */
  .ov { position:absolute; inset:0; background:rgba(16,8,26,.93); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; text-align:center; z-index:5; overflow:auto; }
  .ov.hidden { display:none; }
  .ov > :first-child { margin-top:auto; } .ov > :last-child { margin-bottom:auto; }
  .ov h1 { font-size:34px; font-weight:900; color:#ffb03a; text-shadow:0 3px 0 #7a3a00, 0 0 18px #ff8a2a66; }
  .ov h2 { font-size:24px; font-weight:900; }
  .ov p { font-size:14px; line-height:1.6; color:#d8ccf0; max-width:340px; }
  .ov p b { color:#ffd86a; }
  .big { background:linear-gradient(180deg,#ffd86a,#f08a1a); color:#3a1a00; font-weight:900; font-size:18px; border:none; border-radius:999px; padding:13px 34px; box-shadow:0 3px 0 #8a4400; cursor:pointer; }
  .big:active { transform:translateY(2px); box-shadow:0 1px 0 #8a4400; }
  .sub { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); color:#fff; font-size:14px; font-weight:700; border-radius:999px; padding:9px 18px; cursor:pointer; }
  #vsRow { font-size:46px; letter-spacing:8px; }
  #ladder { display:flex; gap:6px; font-size:24px; }
  #ladder span { opacity:.35; filter:grayscale(1); } #ladder span.done { opacity:1; filter:none; } #ladder span.cur { opacity:1; filter:none; transform:scale(1.25); }
  #heroes { display:flex; gap:8px; justify-content:center; width:100%; max-width:380px; }
  #heroes.hidden { display:none; }
  .hc { flex:1; min-width:0; border:2px solid rgba(255,255,255,.2); background:rgba(255,255,255,.07); border-radius:14px; color:#fff; padding:6px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
  .hc canvas { width:56px; height:56px; background:radial-gradient(circle,#4a2a6a,#241638); border-radius:50%; }
  .hc b { font-size:12px; } .hc small { font-size:9.5px; line-height:1.3; color:#c8bce0; }
  .hc.sel { border-color:#ffd23a; background:rgba(255,210,58,.16); box-shadow:0 0 14px rgba(255,210,58,.35); }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <canvas id="c" width="300" height="240"></canvas>
    <button id="pause" aria-label="일시정지">⏸</button>
  </div>
  <div id="pad">
    <div class="cl">
      <button class="pb j" data-k="jump">⤒<small>점프</small></button>
      <button class="pb" data-k="left">◀</button>
      <button class="pb" data-k="right">▶</button>
    </div>
    <div class="cr">
      <button class="pb sp" data-k="special" id="bSp">✨<small>필살</small></button>
      <button class="pb hv" data-k="heavy">💥<small>강</small></button>
      <button class="pb bk" data-k="block">🛡<small>막기</small></button>
      <button class="pb atk" data-k="light">👊<small>약</small></button>
    </div>
  </div>
</div>

<div class="ov" id="ovStart">
  <h1>🥋 작은 격투</h1>
  <p>컴퓨터 파이터 <b>5명</b>을 차례로 이겨요!<br>3판 2선승, 한 판은 60초.<br>맞히면 <b>기</b>가 차고, 가득 차면 <b>필살기</b>!</p>
  <div id="heroes"></div>
  <div id="ladder"></div>
  <p id="nextOpp"></p>
  <button class="big" id="btnStart">시작하기</button>
  <p style="font-size:12px;color:#a898c8">PC: ← → 이동(두 번 빠르게 누르면 대시), ↑ 점프, J 약, K 강, L 막기, U 필살</p>
</div>
<div class="ov hidden" id="ovPause"><h2>일시정지</h2><div class="row"><button class="big" id="btnResume">계속하기</button><button class="sub" id="btnQuit">그만하기</button></div></div>
<div class="ov hidden" id="ovEnd">
  <h2 id="endTitle">승리!</h2>
  <div id="vsRow"></div>
  <p id="endText"></p>
  <div class="row"><button class="big" id="btnNext">다음 상대</button><button class="sub" id="btnMenu">처음 화면</button></div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
